<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mnd-ver" content="hj9mtik0nnykq6av9l9rg" />
  <title>ADD MONTIAD</title>
  <style>
    body{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;text-align:center}
    #countdown{font-size:80px;font-weight:bold}
  </style>
</head>
<body>
  <div id="countdown">4</div>
  <video id="video" src="video30.mp4" controls autoplay muted playsinline style="width:100%;max-width:500px;display:none;"></video>

<script>
let c=4;
const cd=document.getElementById('countdown');
const int=setInterval(()=>{
  c--;
  cd.textContent=c;
  if(c===0){
    clearInterval(int);
    document.getElementById('countdown').style.display='none';
    document.getElementById('video').style.display='block';
    document.getElementById('video').play();
  }
},1000);
</script>
</body>
</html>
